name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check formatting
        run: ./gradlew spotlessCheck
      - name: Run tests
        run: ./gradlew :plugin:test
      - name: Static analysis (SpotBugs + findsecbugs)
        run: ./gradlew :plugin:spotbugsMain
      - name: Coverage gate
        run: ./gradlew :plugin:jacocoTestCoverageVerification
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: plugin/build/reports/jacoco/test/
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: plugin/build/reports/tests/
